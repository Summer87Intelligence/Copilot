                      - generic [ref=e653]: Pago registrado de un cliente (recibo en Zeta). Suma a caja cuando es posterior al saldo cargado.
                    - generic [ref=e654]:
                      - generic [ref=e655]: Ventas
                      - generic [ref=e656]: Facturación del período. No es igual a cobros ni a deuda.
                    - generic [ref=e657]:
