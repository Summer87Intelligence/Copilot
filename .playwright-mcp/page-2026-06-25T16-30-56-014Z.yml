                  - paragraph [ref=e613]: Referencia rápida de los términos que Copilot usa para describir la deuda de clientes. Cada término tiene un significado preciso para evitar confusión entre saldo, vencimiento y estado.
                  - generic [ref=e614]:
                    - generic [ref=e615]:
                      - generic [ref=e616]: Deuda actual
                      - generic [ref=e617]: Todo lo que el cliente debe actualmente, sin importar si ya venció o no. El atrasado ya está incluido dentro de la deuda actual — no se suma aparte.
                    - generic [ref=e618]:
                      - generic [ref=e619]: Atrasado
                      - generic [ref=e620]: La parte de la deuda actual cuya fecha de vencimiento ya pasó. Está incluido dentro de la deuda actual. Cuanto más alto, más urgente la gestión.
                    - generic [ref=e621]:
                      - generic [ref=e622]: Atrasado +30 días
                      - generic [ref=e623]: La parte del atrasado con más de 30 días. Está incluido dentro del atrasado y de la deuda actual — no se suma aparte.
                    - generic [ref=e624]:
                      - generic [ref=e625]: Días de atraso
                      - generic [ref=e626]: "Clasificación del tiempo desde el vencimiento: Al día, 1–30 días, 31–60 días, 61–90 días o +90 días."
                    - generic [ref=e627]:
                      - generic [ref=e628]: Sin atrasos
                      - generic [ref=e629]: El cliente tiene facturas abiertas pero ninguna venció todavía. Hay deuda actual, pero no es urgente.
                    - generic [ref=e630]:
                      - generic [ref=e631]: Con atrasos
                      - generic [ref=e632]: Al menos una factura del cliente ya superó su fecha de vencimiento. Requiere seguimiento.
                    - generic [ref=e633]:
                      - generic [ref=e634]: Al día
                      - generic [ref=e635]: El cliente tiene deuda actual abierta, pero todas sus facturas están dentro del plazo. No hay atrasos todavía.
                    - generic [ref=e636]:
                      - generic [ref=e637]: Cobro lento
                      - generic [ref=e638]: El cliente tiene historial de pagos lentos o riesgo alto, aunque no tenga vencimientos.
                    - generic [ref=e639]:
                      - generic [ref=e640]: Contactar por atraso
                      - generic [ref=e641]: Acción recomendada cuando el cliente tiene al menos una factura atrasada. Es el caso de mayor urgencia.
                    - generic [ref=e642]:
                      - generic [ref=e643]: Hacer seguimiento
                      - generic [ref=e644]: Acción recomendada para clientes con historial de pagos lentos o riesgo alto, aunque no tengan vencimientos.
                    - generic [ref=e645]:
                      - generic [ref=e646]: Revisar ficha
                      - generic [ref=e647]: Acción recomendada para clientes con deuda corriente. Sin urgencia inmediata.
                    - generic [ref=e648]:
                      - generic [ref=e649]: Caja disponible
                      - generic [ref=e650]: "Dinero operativo en Tesorería: saldo cargado al corte más cobros Zeta posteriores y movimientos manuales confirmados, menos egresos confirmados."
                    - generic [ref=e651]:
